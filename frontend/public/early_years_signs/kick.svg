<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-kick" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-kick" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF7ED"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-kick)" stroke="#F97316" stroke-width="2.5" filter="url(#shadow-kick)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#F97316"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">11</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#F97316" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Soccer ball flying -->
            <circle cx="215" cy="130" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
            <polygon points="215,124 220,128 218,134 212,134 210,128" fill="#1E293B"/>
            <line x1="225" y1="120" x2="235" y2="115" stroke="#FB923C" stroke-width="2.5"/>
            <line x1="225" y1="135" x2="238" y2="135" stroke="#FB923C" stroke-width="2.5"/>
            <!-- Head & determined look -->
            <circle cx="125" cy="80" r="26" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="132" cy="76" r="2.5" fill="#1E293B"/>
            <path d="M 126 88 Q 132 92 138 88" fill="none" stroke="#1E293B" stroke-width="2"/>
            <!-- Body balanced backward on left standing leg -->
            <path d="M 110 115 L 145 110 L 135 165 L 105 165 Z" fill="#FB923C" stroke="#1E293B" stroke-width="3"/>
            <!-- Arms balancing -->
            <path d="M 115 120 Q 95 125 85 140" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 140 115 Q 165 110 175 125" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Left standing leg firmly on ground -->
            <path d="M 115 165 L 115 215" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Right leg extended straight up kicking ball -->
            <path d="M 135 165 Q 165 155 200 140" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Arc arrow showing kicking foot trajectory -->
            <path d="M 145 195 C 180 195 195 170 200 150" fill="none" stroke="#EA580C" stroke-width="3.5"/>
            <polygon points="202,143 194,150 203,153" fill="#EA580C"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Kick</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#F97316" text-anchor="end">लात मारना</text>
</svg>