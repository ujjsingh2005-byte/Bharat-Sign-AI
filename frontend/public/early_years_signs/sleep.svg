<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-sleep" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-sleep" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EEF2FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-sleep)" stroke="#6366F1" stroke-width="2.5" filter="url(#shadow-sleep)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#6366F1"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">9</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#6366F1" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Tilted sleeping head resting on hands -->
            <g transform="rotate(18, 145, 95)">
                <circle cx="145" cy="95" r="32" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
                <!-- Peaceful closed curved eyes -->
                <path d="M 133 93 Q 140 98 147 93" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 153 93 Q 160 98 167 93" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 145 108 Q 150 113 155 108" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
            </g>
            <!-- Body relaxed -->
            <path d="M 115 165 Q 145 145 175 165 L 170 220 L 120 220 Z" fill="#818CF8" stroke="#1E293B" stroke-width="3"/>
            <!-- Both hands pressed together flat under tilted right cheek -->
            <path d="M 165 170 Q 185 150 185 125" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 135 170 Q 170 155 180 130" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Hands pillow shape -->
            <ellipse cx="188" cy="120" rx="14" ry="7" transform="rotate(30, 188, 120)" fill="#FDE68A" stroke="#1E293B" stroke-width="2"/>
            <!-- Floating Zzz -->
            <text x="70" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#6366F1">Z</text>
            <text x="88" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#818CF8">z</text>
            <text x="102" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#A5B4FC">z</text>
            <!-- Gentle head tilt arrow -->
            <path d="M 125 55 Q 150 48 165 62" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
            <polygon points="168,66 165,58 159,63" fill="#4F46E5"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Sleep</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#6366F1" text-anchor="end">सोना</text>
</svg>