    <title>Bharat Sign AI 3 - Master Studio</title>
    <script>
      // Suppress benign third-party notices (THREE.Clock deprecation & MediaPipe WebGL WASM GL context notices)
      (function() {
        var _warn = console.warn;
        var _error = console.error;
        function isBenign(arg) {
          if (arg && typeof arg === 'string') {
            if (arg.indexOf('THREE.Clock: This module has been deprecated') !== -1) return true;
            if (arg.indexOf('gl_context') !== -1 || arg.indexOf('gl_context_webgl') !== -1) return true;
            if (arg.indexOf('OpenGL error checking is disabled') !== -1) return true;
            if (arg.indexOf('Successfully created a WebGL context') !== -1) return true;
          }
          return false;
        }
        console.warn = function() {
          if (isBenign(arguments[0])) return;
          return _warn.apply(console, arguments);
        };
        console.error = function() {
          if (isBenign(arguments[0])) return;
          return _error.apply(console, arguments);
        };
      })();
    </script>
    <!-- MediaPipe Hands & Camera Utils: Official Tested CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
