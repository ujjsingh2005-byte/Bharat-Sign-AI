<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-wait" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-wait" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-wait)" stroke="#64748B" stroke-width="2.5" filter="url(#shadow-wait)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#64748B"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">12</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#64748B" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Wall clock icon in corner showing passage of time -->
            <circle cx="65" cy="65" r="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
            <line x1="65" y1="65" x2="65" y2="55" stroke="#1E293B" stroke-width="2"/>
            <line x1="65" y1="65" x2="73" y2="65" stroke="#1E293B" stroke-width="2"/>
            <!-- Head in calm patient expression -->
            <circle cx="150" cy="85" r="30" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="143" cy="78" r="2.5" fill="#1E293B"/>
            <circle cx="157" cy="78" r="2.5" fill="#1E293B"/>
            <line x1="145" y1="94" x2="155" y2="94" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
            <!-- Body upright and still -->
            <path d="M 125 140 Q 150 130 175 140 L 170 215 L 130 215 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="3"/>
            <!-- Both hands held out at chest level, palms facing downward / slightly up, patient hold -->
            <path d="M 130 145 Q 120 175 140 180" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 170 145 Q 180 175 160 180" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Hands held stationary -->
            <line x1="130" y1="180" x2="150" y2="180" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
            <line x1="150" y1="180" x2="170" y2="180" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
            <!-- Gentle hold / pause bars -->
            <line x1="195" y1="160" x2="195" y2="185" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
            <line x1="205" y1="160" x2="205" y2="185" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
            <text x="190" y="202" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">PAUSE</text>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Wait</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#64748B" text-anchor="end">इंतज़ार करना</text>
</svg>