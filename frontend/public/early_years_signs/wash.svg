<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-wash" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-wash" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F0F9FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-wash)" stroke="#0284C7" stroke-width="2.5" filter="url(#shadow-wash)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#0284C7"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">14</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#0284C7" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Water tap / bubbles -->
            <circle cx="180" cy="130" r="6" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
            <circle cx="195" cy="145" r="4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
            <circle cx="110" cy="140" r="5" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
            <circle cx="105" cy="160" r="7" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
            <!-- Head looking down at hands with smile -->
            <circle cx="150" cy="85" r="30" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <path d="M 142 80 Q 146 84 150 84" fill="none" stroke="#1E293B" stroke-width="2"/>
            <path d="M 154 80 Q 158 84 162 84" fill="none" stroke="#1E293B" stroke-width="2"/>
            <path d="M 146 96 Q 152 102 158 96" fill="none" stroke="#1E293B" stroke-width="2"/>
            <!-- Body -->
            <path d="M 125 140 Q 150 130 175 140 L 170 215 L 130 215 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="3"/>
            <!-- Arms brought together in front of chest -->
            <path d="M 128 142 Q 135 170 145 170" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 172 142 Q 165 170 155 170" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Hands rubbing together in center -->
            <ellipse cx="145" cy="170" rx="9" ry="7" fill="#FCD34D" stroke="#1E293B" stroke-width="2"/>
            <ellipse cx="155" cy="170" rx="9" ry="7" fill="#FCD34D" stroke="#1E293B" stroke-width="2"/>
            <!-- Circular circular rubbing arrows -->
            <path d="M 140 155 C 130 162 132 178 142 182" fill="none" stroke="#0369A1" stroke-width="3"/>
            <polygon points="144,183 138,177 136,185" fill="#0369A1"/>
            <path d="M 160 185 C 170 178 168 162 158 158" fill="none" stroke="#0369A1" stroke-width="3"/>
            <polygon points="156,157 162,163 164,155" fill="#0369A1"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Wash</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0284C7" text-anchor="end">धोना</text>
</svg>