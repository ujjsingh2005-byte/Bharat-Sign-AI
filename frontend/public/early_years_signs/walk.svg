<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-walk" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-walk" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ECFDF5"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-walk)" stroke="#10B981" stroke-width="2.5" filter="url(#shadow-walk)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#10B981"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">13</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#10B981" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Footprint dots along path -->
            <ellipse cx="75" cy="215" rx="5" ry="3" fill="#A7F3D0"/>
            <ellipse cx="105" cy="210" rx="5" ry="3" fill="#A7F3D0"/>
            <ellipse cx="135" cy="215" rx="5" ry="3" fill="#6EE7B7"/>
            <ellipse cx="165" cy="210" rx="5" ry="3" fill="#34D399"/>
            <ellipse cx="195" cy="215" rx="5" ry="3" fill="#10B981"/>
            <!-- Head upright -->
            <circle cx="140" cy="80" r="28" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="148" cy="75" r="3" fill="#1E293B"/>
            <path d="M 144 88 Q 150 92 155 88" fill="none" stroke="#1E293B" stroke-width="2"/>
            <!-- Body upright walking posture -->
            <path d="M 125 120 L 160 115 L 150 170 L 120 170 Z" fill="#34D399" stroke="#1E293B" stroke-width="3"/>
            <!-- Arms swinging gently in natural gait -->
            <path d="M 128 122 Q 115 140 108 155" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 155 118 Q 170 135 180 150" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Legs in split stride -->
            <path d="M 130 170 L 115 215" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 145 170 L 175 210" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Steady forward walking arrow -->
            <path d="M 175 160 L 210 160" fill="none" stroke="#059669" stroke-width="3.5"/>
            <polygon points="217,160 207,155 207,165" fill="#059669"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Walk</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="end">चलना</text>
</svg>