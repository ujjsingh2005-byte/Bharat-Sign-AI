<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-fall" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-fall" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F5F3FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-fall)" stroke="#8B5CF6" stroke-width="2.5" filter="url(#shadow-fall)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#8B5CF6"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#8B5CF6" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Ground baseline -->
            <line x1="70" y1="215" x2="230" y2="215" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <!-- Character tilting back/falling -->
            <circle cx="120" cy="95" r="28" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <!-- Surprised eyes 'O' -->
            <circle cx="115" cy="90" r="3.5" fill="#1E293B"/>
            <circle cx="128" cy="90" r="3.5" fill="#1E293B"/>
            <circle cx="122" cy="103" r="5" fill="#EF4444" stroke="#1E293B" stroke-width="1.5"/>
            <!-- Body toppling backward -->
            <path d="M 130 120 L 165 145 L 140 190 L 110 160 Z" fill="#A78BFA" stroke="#1E293B" stroke-width="3"/>
            <!-- Arms flailing in air -->
            <path d="M 125 130 Q 95 110 90 90" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 150 140 Q 180 115 190 95" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Legs slipping forward -->
            <path d="M 140 190 Q 170 205 200 205" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Tumbling downward arc arrow -->
            <path d="M 165 80 C 195 85 210 130 195 170" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-dasharray="4,2"/>
            <polygon points="190,175 198,168 202,174" fill="#7C3AED"/>
            <circle cx="160" cy="78" r="4" fill="#8B5CF6"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Fall</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#8B5CF6" text-anchor="end">गिरना</text>
</svg>