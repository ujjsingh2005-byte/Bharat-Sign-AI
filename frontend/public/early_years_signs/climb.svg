<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-climb" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-climb" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFBEB"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-climb)" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow-climb)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#F59E0B"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#F59E0B" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Ladder rungs background -->
            <line x1="85" y1="50" x2="85" y2="230" stroke="#CBD5E1" stroke-width="4"/>
            <line x1="215" y1="50" x2="215" y2="230" stroke="#CBD5E1" stroke-width="4"/>
            <line x1="85" y1="75" x2="215" y2="75" stroke="#94A3B8" stroke-width="3"/>
            <line x1="85" y1="120" x2="215" y2="120" stroke="#94A3B8" stroke-width="3"/>
            <line x1="85" y1="165" x2="215" y2="165" stroke="#94A3B8" stroke-width="3"/>
            <line x1="85" y1="210" x2="215" y2="210" stroke="#94A3B8" stroke-width="3"/>
            <!-- Character Head looking up -->
            <circle cx="150" cy="100" r="28" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="143" cy="94" r="3" fill="#1E293B"/>
            <circle cx="157" cy="94" r="3" fill="#1E293B"/>
            <path d="M 145 108 Q 150 114 155 108" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <!-- Body tilted forward -->
            <path d="M 130 145 L 170 145 L 160 200 L 140 200 Z" fill="#FBBF24" stroke="#1E293B" stroke-width="3"/>
            <!-- Left hand reaching high to grasp rung -->
            <path d="M 135 145 Q 115 110 110 75" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <circle cx="110" cy="75" r="7" fill="#FCD34D" stroke="#1E293B" stroke-width="2"/>
            <!-- Right hand lower grip -->
            <path d="M 165 145 Q 185 135 190 120" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <circle cx="190" cy="120" r="7" fill="#FCD34D" stroke="#1E293B" stroke-width="2"/>
            <!-- Climbing upward motion arrows -->
            <path d="M 100 110 L 100 85" fill="none" stroke="#D97706" stroke-width="3.5"/>
            <polygon points="100,78 95,88 105,88" fill="#D97706"/>
            <path d="M 200 150 L 200 128" fill="none" stroke="#D97706" stroke-width="3.5"/>
            <polygon points="200,122 195,132 205,132" fill="#D97706"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Climb</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="end">चढ़ना</text>
</svg>