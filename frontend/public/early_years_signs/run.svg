<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-run" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-run" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FEF2F2"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-run)" stroke="#EF4444" stroke-width="2.5" filter="url(#shadow-run)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#EF4444"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#EF4444" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Motion speed lines -->
            <line x1="60" y1="120" x2="95" y2="120" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
            <line x1="50" y1="140" x2="100" y2="140" stroke="#F87171" stroke-width="4" stroke-linecap="round"/>
            <line x1="65" y1="160" x2="90" y2="160" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
            <!-- Head leaning forward -->
            <circle cx="165" cy="85" r="28" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="172" cy="80" r="3" fill="#1E293B"/>
            <path d="M 168 94 Q 175 97 180 93" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <!-- Body leaning dynamically forward -->
            <path d="M 140 125 L 180 115 L 165 175 L 130 170 Z" fill="#F87171" stroke="#1E293B" stroke-width="3"/>
            <!-- Left arm back -->
            <path d="M 145 125 Q 120 120 115 145" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <circle cx="115" cy="145" r="6" fill="#FCD34D" stroke="#1E293B" stroke-width="2"/>
            <!-- Right arm forward bent 90 deg -->
            <path d="M 175 120 Q 200 135 210 115" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <circle cx="210" cy="115" r="6" fill="#FCD34D" stroke="#1E293B" stroke-width="2"/>
            <!-- Legs running -->
            <path d="M 140 170 Q 120 190 100 215" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 160 175 Q 190 195 205 220" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Fast alternating arrows -->
            <path d="M 185 100 Q 205 95 215 105" fill="none" stroke="#DC2626" stroke-width="2.5"/>
            <polygon points="217,108 214,101 220,103" fill="#DC2626"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Run</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#EF4444" text-anchor="end">दौड़ना</text>
</svg>