<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-sit-down" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-sit-down" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F0FDFA"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-sit-down)" stroke="#14B8A6" stroke-width="2.5" filter="url(#shadow-sit-down)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#14B8A6"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">10</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#14B8A6" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Chair outline -->
            <path d="M 180 130 L 180 195 L 205 195 M 180 170 L 155 170 L 155 220 M 180 195 L 180 220" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <!-- Head -->
            <circle cx="140" cy="85" r="26" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="134" cy="80" r="2.5" fill="#1E293B"/>
            <circle cx="146" cy="80" r="2.5" fill="#1E293B"/>
            <path d="M 136 94 Q 140 98 144 94" fill="none" stroke="#1E293B" stroke-width="2"/>
            <!-- Body seated at right angle -->
            <path d="M 130 120 L 155 120 L 155 170 L 125 170 Z" fill="#2DD4BF" stroke="#1E293B" stroke-width="3"/>
            <!-- Legs bent at 90 deg sitting on chair seat -->
            <path d="M 140 170 L 175 170 L 175 215" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Both hands palms down moving downward into lap -->
            <path d="M 130 125 Q 115 145 120 165" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <line x1="110" y1="165" x2="130" y2="165" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
            <!-- Two bold downward settling arrows -->
            <path d="M 95 105 L 95 145" fill="none" stroke="#0D9488" stroke-width="3.5"/>
            <polygon points="95,153 90,143 100,143" fill="#0D9488"/>
            <path d="M 80 115 L 80 145" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-dasharray="3,2"/>
            <polygon points="80,150 77,143 83,143" fill="#0D9488"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Sit Down</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#14B8A6" text-anchor="end">बैठना</text>
</svg>