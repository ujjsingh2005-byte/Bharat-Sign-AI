<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-jump" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-jump" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDF2F8"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-jump)" stroke="#EC4899" stroke-width="2.5" filter="url(#shadow-jump)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#EC4899"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">16</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#EC4899" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Ground baseline -->
            <line x1="60" y1="220" x2="240" y2="220" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <!-- Spring / dust puffs on ground -->
            <path d="M 130 220 Q 135 210 140 220 Q 145 210 150 220 Q 155 210 160 220" fill="none" stroke="#F472B6" stroke-width="3"/>
            <!-- Character leaping high in the air! -->
            <circle cx="150" cy="65" r="28" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <!-- Excited laughing expression -->
            <path d="M 140 58 Q 145 54 150 58" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <path d="M 152 58 Q 157 54 162 58" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <path d="M 144 72 Q 151 82 158 72 Z" fill="#EF4444" stroke="#1E293B" stroke-width="1.5"/>
            <!-- Body high off ground -->
            <path d="M 130 100 Q 150 90 170 100 L 165 150 L 135 150 Z" fill="#F472B6" stroke="#1E293B" stroke-width="3"/>
            <!-- Arms thrown up joyfully -->
            <path d="M 135 105 Q 110 85 105 60" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 165 105 Q 190 85 195 60" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Legs tucked up in bent jumping pose -->
            <path d="M 140 150 Q 120 165 130 185" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 160 150 Q 180 165 170 185" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Bold upward jumping spring arrow -->
            <path d="M 80 180 L 80 120" fill="none" stroke="#DB2777" stroke-width="4"/>
            <polygon points="80,110 73,123 87,123" fill="#DB2777"/>
            <path d="M 220 180 L 220 120" fill="none" stroke="#DB2777" stroke-width="4"/>
            <polygon points="220,110 213,123 227,123" fill="#DB2777"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Jump</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#EC4899" text-anchor="end">कूदना</text>
</svg>