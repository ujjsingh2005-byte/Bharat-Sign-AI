<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-look" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-look" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F5F3FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-look)" stroke="#8B5CF6" stroke-width="2.5" filter="url(#shadow-look)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#8B5CF6"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">15</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#8B5CF6" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Big attentive eye in corner -->
            <path d="M 200 70 Q 215 58 230 70 Q 215 82 200 70 Z" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
            <circle cx="215" cy="70" r="5" fill="#6D28D9"/>
            <circle cx="216" cy="69" r="1.5" fill="#FFFFFF"/>
            <!-- Head facing right attentively -->
            <circle cx="140" cy="85" r="30" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <!-- Wide open looking eyes -->
            <circle cx="142" cy="78" r="4" fill="#1E293B"/>
            <circle cx="156" cy="78" r="4" fill="#1E293B"/>
            <circle cx="143" cy="76" r="1.5" fill="#FFFFFF"/>
            <circle cx="157" cy="76" r="1.5" fill="#FFFFFF"/>
            <path d="M 144 95 Q 150 100 156 95" fill="none" stroke="#1E293B" stroke-width="2"/>
            <!-- Body -->
            <path d="M 120 145 Q 145 135 170 145 L 165 215 L 125 215 Z" fill="#A78BFA" stroke="#1E293B" stroke-width="3"/>
            <!-- Left arm resting -->
            <path d="M 125 150 Q 110 180 115 205" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Right hand raised: 'V' handshape (index & middle) pointing from eyes outward -->
            <path d="M 165 145 Q 185 130 175 95" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Two fingers pointing straight forward from eye level -->
            <line x1="172" y1="90" x2="200" y2="85" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
            <line x1="172" y1="96" x2="200" y2="93" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
            <!-- Sight lines beaming outward -->
            <line x1="205" y1="88" x2="235" y2="88" stroke="#7C3AED" stroke-width="3" stroke-dasharray="4,3"/>
            <polygon points="242,88 232,83 232,93" fill="#7C3AED"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Look</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#8B5CF6" text-anchor="end">देखना</text>
</svg>