<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-give" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-give" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ECFEFF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-give)" stroke="#06B6D4" stroke-width="2.5" filter="url(#shadow-give)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#06B6D4"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">6</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#06B6D4" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Head & Smile -->
            <circle cx="150" cy="85" r="30" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <circle cx="142" cy="78" r="3" fill="#1E293B"/>
            <circle cx="158" cy="78" r="3" fill="#1E293B"/>
            <path d="M 144 95 Q 150 102 156 95" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Body -->
            <path d="M 125 145 Q 150 130 175 145 L 170 215 L 130 215 Z" fill="#22D3EE" stroke="#1E293B" stroke-width="3"/>
            <!-- Both hands extending outward with open cupped palms -->
            <path d="M 130 150 Q 140 175 175 175" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 170 150 Q 180 175 215 175" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Cupped flat hands -->
            <path d="M 175 175 Q 190 172 192 165" fill="none" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
            <path d="M 215 175 Q 230 172 232 165" fill="none" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
            <!-- Gift / object being given -->
            <rect x="188" y="145" width="24" height="20" rx="3" fill="#F43F5E" stroke="#1E293B" stroke-width="2"/>
            <line x1="200" y1="145" x2="200" y2="165" stroke="#FEF08A" stroke-width="2.5"/>
            <!-- Outward presenting arrows -->
            <path d="M 145 130 L 195 130" fill="none" stroke="#0891B2" stroke-width="3.5"/>
            <polygon points="202,130 192,125 192,135" fill="#0891B2"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Give</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#06B6D4" text-anchor="end">देना</text>
</svg>