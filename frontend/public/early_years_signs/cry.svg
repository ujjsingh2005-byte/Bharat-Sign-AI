<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-cry" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-cry" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EFF6FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-cry)" stroke="#3B82F6" stroke-width="2.5" filter="url(#shadow-cry)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#3B82F6"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">8</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#3B82F6" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Head & Sad Expression -->
            <circle cx="150" cy="95" r="34" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <!-- Sad downturned eyebrows -->
            <path d="M 136 78 Q 142 84 146 86" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <path d="M 164 78 Q 158 84 154 86" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <!-- Closed crying eyes -->
            <path d="M 135 88 Q 142 84 147 88" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
            <path d="M 153 88 Q 158 84 165 88" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
            <!-- Open sad mouth -->
            <path d="M 142 112 Q 150 104 158 112 Z" fill="#EF4444" stroke="#1E293B" stroke-width="2"/>
            <!-- Body -->
            <path d="M 125 165 Q 150 145 175 165 L 170 220 L 130 220 Z" fill="#93C5FD" stroke="#1E293B" stroke-width="3"/>
            <!-- Both hands raised with index fingers tracing tears down cheeks -->
            <path d="M 125 165 Q 110 140 136 102" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <path d="M 175 165 Q 190 140 164 102" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
            <!-- Index fingers on cheeks -->
            <circle cx="137" cy="100" r="4.5" fill="#FCD34D" stroke="#1E293B" stroke-width="1.5"/>
            <circle cx="163" cy="100" r="4.5" fill="#FCD34D" stroke="#1E293B" stroke-width="1.5"/>
            <!-- Falling teardrops and downward path arrows -->
            <path d="M 137 104 L 137 130" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="3,2"/>
            <polygon points="137,135 133,127 141,127" fill="#2563EB"/>
            <path d="M 163 104 L 163 130" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="3,2"/>
            <polygon points="163,135 159,127 167,127" fill="#2563EB"/>
            <!-- Teardrops -->
            <ellipse cx="137" cy="122" rx="3" ry="5" fill="#60A5FA"/>
            <ellipse cx="163" cy="122" rx="3" ry="5" fill="#60A5FA"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Cry</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3B82F6" text-anchor="end">रोना</text>
</svg>