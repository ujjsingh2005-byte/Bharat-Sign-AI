<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-drink" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-drink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EFF6FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-drink)" stroke="#3B82F6" stroke-width="2.5" filter="url(#shadow-drink)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#3B82F6"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#3B82F6" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Head & Face -->
            <circle cx="150" cy="90" r="32" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <path d="M 138 85 Q 142 88 146 85" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="140" cy="82" r="3" fill="#1E293B"/>
            <circle cx="160" cy="82" r="3" fill="#1E293B"/>
            <!-- Open smiling mouth ready to drink -->
            <path d="M 144 100 Q 150 106 156 100 Z" fill="#EF4444" stroke="#1E293B" stroke-width="1.5"/>
            <!-- Body -->
            <path d="M 120 160 Q 150 135 180 160 L 175 220 L 125 220 Z" fill="#60A5FA" stroke="#1E293B" stroke-width="3"/>
            <!-- Left arm resting -->
            <path d="M 125 155 Q 110 185 115 210" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Right arm lifting cup to mouth -->
            <path d="M 175 155 Q 200 170 180 120 Q 170 105 160 105" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
            <!-- Cup / Tumbler in hand -->
            <path d="M 158 96 L 172 96 L 168 116 L 162 116 Z" fill="#38BDF8" stroke="#0369A1" stroke-width="2.5"/>
            <!-- Curved Movement Arrow lifting cup to mouth -->
            <path d="M 195 145 C 205 125 185 110 172 102" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="4,2"/>
            <polygon points="168,100 178,102 173,109" fill="#2563EB"/>
            <circle cx="178" cy="95" r="4" fill="#3B82F6"/>
            <!-- Water drop icon -->
            <path d="M 195 90 C 195 85 190 80 190 77 C 190 80 185 85 185 90 C 185 93 187 95 190 95 C 193 95 195 93 195 90 Z" fill="#0EA5E9"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Drink</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3B82F6" text-anchor="end">पीना</text>
</svg>