<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-push" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-push" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDF2F8"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-push)" stroke="#EC4899" stroke-width="2.5" filter="url(#shadow-push)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#EC4899"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">7</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#EC4899" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Heavy box / barrier being pushed -->
            <rect x="205" y="90" width="35" height="110" rx="4" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
            <line x1="205" y1="125" x2="240" y2="125" stroke="#94A3B8" stroke-width="2"/>
            <line x1="205" y1="165" x2="240" y2="165" stroke="#94A3B8" stroke-width="2"/>
            <!-- Head bracing forward -->
            <circle cx="120" cy="90" r="28" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <path d="M 112 85 L 118 85" stroke="#1E293B" stroke-width="2.5"/>
            <path d="M 124 85 L 130 85" stroke="#1E293B" stroke-width="2.5"/>
            <path d="M 115 100 Q 122 96 128 100" fill="none" stroke="#1E293B" stroke-width="2.5"/>
            <!-- Torso leaning forward with strength -->
            <path d="M 100 135 L 140 120 L 130 185 L 90 175 Z" fill="#F472B6" stroke="#1E293B" stroke-width="3"/>
            <!-- Both arms extended straight with flat vertical palms pressing wall -->
            <path d="M 115 130 L 205 130" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <path d="M 125 145 L 205 145" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <!-- Flat palm vertical stops -->
            <line x1="205" y1="122" x2="205" y2="138" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
            <line x1="205" y1="137" x2="205" y2="153" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
            <!-- Bold force arrows pushing forward -->
            <path d="M 135 105 L 175 105" fill="none" stroke="#DB2777" stroke-width="4"/>
            <polygon points="183,105 173,100 173,110" fill="#DB2777"/>
            <path d="M 135 168 L 175 168" fill="none" stroke="#DB2777" stroke-width="4"/>
            <polygon points="183,168 173,163 173,173" fill="#DB2777"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Push</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#EC4899" text-anchor="end">धकेलना</text>
</svg>