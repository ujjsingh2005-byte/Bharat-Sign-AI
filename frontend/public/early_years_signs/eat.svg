<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
    <defs>
        <filter id="shadow-eat" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="grad-eat" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ECFDF5"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect x="8" y="8" width="284" height="264" rx="20" fill="url(#grad-eat)" stroke="#10B981" stroke-width="2.5" filter="url(#shadow-eat)"/>
    
    <!-- Top Number Badge -->
    <g transform="translate(22, 22)">
        <circle cx="16" cy="16" r="16" fill="#10B981"/>
        <text x="16" y="21" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <!-- Sign Language Tag -->
    <rect x="180" y="22" width="98" height="24" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="229" y="38" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#10B981" text-anchor="middle">BSL / EYFS SIGN</text>

    <!-- Character Illustration Content -->
    <g transform="translate(0, 5)">
        
            <!-- Head & Face -->
            <circle cx="150" cy="90" r="32" fill="#FCD34D" stroke="#1E293B" stroke-width="3"/>
            <path d="M 138 85 Q 142 88 146 85" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="140" cy="82" r="3" fill="#1E293B"/>
            <circle cx="160" cy="82" r="3" fill="#1E293B"/>
            <path d="M 145 102 Q 150 108 155 102" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Body -->
            <path d="M 120 160 Q 150 135 180 160 L 175 220 L 125 220 Z" fill="#34D399" stroke="#1E293B" stroke-width="3"/>
            <!-- Left hand holding small plate -->
            <path d="M 125 155 Q 110 180 130 195" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <ellipse cx="135" cy="195" rx="16" ry="5" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
            <!-- Right hand pinched fingers moving to mouth -->
            <path d="M 175 155 Q 195 175 170 135 Q 160 115 154 106" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
            <circle cx="152" cy="104" r="6" fill="#FBBF24" stroke="#1E293B" stroke-width="2"/>
            <!-- Repeated tap motion arrow -->
            <path d="M 175 130 Q 165 115 156 108" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="3,2"/>
            <polygon points="152,106 158,113 162,106" fill="#059669"/>
            <circle cx="168" cy="120" r="2.5" fill="#10B981"/>
            <circle cx="162" cy="112" r="2.5" fill="#10B981"/>
        
    </g>

    <!-- Bottom Word Label Bar -->
    <rect x="18" y="225" width="264" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="75" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="start">Eat</text>
    <text x="260" y="252" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="end">खाना</text>
</svg>